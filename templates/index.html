{% extends 'base.html' %}

{%block content %}
<p>{{ movies|length }} Titles</p>
<ul class = "movie-list">
    {% for movie in movies %}
    <li>{{ movie.title }} - {{ movie.year }}
        <span class = "float-right">
            <a class = "imdb" href = "https://www.imdb.com/find?q={{ movie.title }}" target = "_blank" title = "Find this movie on IMdb">IMdb</a>
        </span>
    </li>
    {% endfor %}
</ul>
<img alt = "Walking Totoro" class = "totoro" height = "40px" width = "40px" src = "{{ url_for('static', filename = 'img/冲刺.png') }}" title = "totoro">
{% endblock %}
